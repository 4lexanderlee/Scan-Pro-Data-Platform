version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: scanpro_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Este truco evita que tu node_modules local aplaste al del contenedor
    environment:
      - CHOKIDAR_USEPOLLING=true # Asegura que Vite recargue al guardar archivos
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: scanpro_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app